[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-pick"
version = "0.1.0"
description = "CLI to find the fastest, cheapest GPU instance for ML training and eval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "boto3>=1.26",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gpu-pick = "gpupick.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gpupick"]

[tool.ruff]
line-length = 100
